name: AI Resume Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      # Устанавливаем python-docx и openai
      run: pip install python-docx openai

    - name: Run AI Pipeline
      # Передаем ключ из секретов GitHub в переменные окружения
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      run: python generate_cv.py

    - name: Upload Resume Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Savelyev_Resume
        path: Savelyev_Resume.docx
