<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-8">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">🚀 AI Resume Builder</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">1. Ваше базовое резюме</label>
                <textarea id="resume" rows="12" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="Вставьте ваш текст..."></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">2. Текст вакансии</label>
                <textarea id="vacancy" rows="12" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="Вставьте требования..."></textarea>
            </div>
        </div>

        <div class="text-center">
            <button onclick="processResume()" id="submitBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition duration-300">
                Запустить AI-анализ
            </button>
        </div>

        <!-- Блок загрузки -->
        <div id="loading" class="hidden text-center mt-6 text-blue-500 font-semibold">
            <div class="animate-spin inline-block w-6 h-6 border-4 border-blue-500 border-t-transparent rounded-full mb-2"></div>
            <p>Нейросеть анализирует и переписывает резюме. Подождите около 30 секунд...</p>
        </div>

        <!-- Результаты -->
        <div id="results" class="hidden mt-8 grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-blue-50 p-6 rounded-lg border border-blue-200">
                <h2 class="text-xl font-bold text-blue-800 mb-3">Мнение HR-эксперта</h2>
                <div id="feedback" class="text-gray-700 whitespace-pre-wrap"></div>
            </div>
            <div class="bg-green-50 p-6 rounded-lg border border-green-200">
                <h2 class="text-xl font-bold text-green-800 mb-3">Финальное резюме</h2>
                <textarea id="finalResume" rows="10" class="w-full p-3 border border-green-300 rounded-lg"></textarea>
                <button onclick="downloadWord()" class="mt-4 w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg">
                    📥 Скачать в Word
                </button>
            </div>
        </div>
    </div>

    <script>
        async function processResume() {
            const resume = document.getElementById('resume').value;
            const vacancy = document.getElementById('vacancy').value;

            if (!resume || !vacancy) {
                alert("Заполните оба поля!");
                return;
            }

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('results').classList.add('hidden');

            try {
                const response = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resume, vacancy })
                });

                const data = await response.json();
                
                document.getElementById('feedback').innerText = data.feedback;
                document.getElementById('finalResume').value = data.final_resume;
                document.getElementById('results').classList.remove('hidden');
            } catch (error) {
                alert("Ошибка: " + error.message);
            } finally {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('submitBtn').disabled = false;
            }
        }

        async function downloadWord() {
            const text = document.getElementById('finalResume').value;
            const response = await fetch('/api/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "Resume.docx";
            a.click();
        }
    </script>
</body>
</html>
